name: Bug report
description: Something doesn't work as the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. VSX Deck is built around one person's workflow and support isn't guaranteed
        (see the README's "Feedback and scope"), but a complete report is the one that gets looked at.
  - type: input
    id: version
    attributes:
      label: VSX Deck version
      description: In the app's About window (ⓘ), or "Version" in com.vsxdeck.sdPlugin\manifest.json.
      placeholder: 0.3.5
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Install
      options:
        - System-wide
        - DAW only
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: output
    attributes:
      label: Output device and sample rate
      description: The device VSX Deck plays to (Settings), and its rate in Sound settings.
      placeholder: Speakers (Realtek Audio), 48 kHz
  - type: input
    id: daw
    attributes:
      label: DAW and version (if you use one)
      placeholder: Reaper 6.83
  - type: input
    id: deck
    attributes:
      label: Stream Deck model and Stream Deck app version
      placeholder: Stream Deck MK.2, 6.8
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Steps to make it happen again, if you know them.
    validations:
      required: true
  - type: input
    id: dropouts
    attributes:
      label: Dropouts count in the header (for crackles or gaps)
  - type: textarea
    id: log
    attributes:
      label: Last lines of the log
      description: From %LOCALAPPDATA%\VSX Deck\vsxdeck.log (system-wide install).
      render: text
